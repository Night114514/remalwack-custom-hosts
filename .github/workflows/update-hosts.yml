name: Update hosts

on:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-hosts.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *" # 10:15 Hong Kong time (UTC+8)

permissions:
  contents: write

concurrency:
  group: update-hosts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build hosts
        run: python scripts/build_hosts.py

      - name: Commit changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- hosts.txt)" ]; then
            echo "No hosts changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosts.txt
          git commit -m "chore: update hosts"
          git push
